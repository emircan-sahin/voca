# Voca

> Open-source desktop app that transcribes voice with AI corrections and translates into 100+ languages.

Voca is a cross-platform desktop app for macOS and Windows. Press a global keyboard shortcut from any app, speak, and the AI-corrected transcript is auto-pasted where your cursor was. Uses Deepgram Nova-3 and Groq Whisper for STT (35+ languages) and xAI Grok for translation (100+ languages). New accounts get the first month free — $3 in credits, no credit card required. Paid plans start at $3/month.

## Key Features
- Global shortcut triggers recording from any app
- AI-corrected transcription (grammar, wording, filler word removal)
- Auto-paste to cursor position - no copy-paste required
- Developer Mode for code terms, function names, and technical jargon
- 100+ language translation with tone control
- Background noise cancellation
- Deepgram Nova-3 and Groq Whisper STT engines

## Plans
- Pro: $3/month - $3 monthly credits, 10 MB upload limit
- Max: $10/month - $10 monthly credits, 25 MB upload limit
- Free: First month free on sign up - $3 in credits, no credit card required, no plan selection needed

## Links
- Full details: https://usevoca.dev/llms-full.txt
- GitHub: https://github.com/emircan-sahin/voca
